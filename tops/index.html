<title>陀螺鬥場</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: the stadium fills the screen; a scoreboard sits on top, launch controls and banners float over the arena. Sports-broadcast look: deep indigo night arena, stadium-yellow and signal-red accents. */
:root {
  --bg: #12122a;
  --panel: rgba(16, 16, 40, .82);
  --line: rgba(255, 255, 255, .14);
  --fg: #f2f0ff;
  --muted: #9a98c2;
  --gold: #ffc93c;
  --red: #ff4b3a;
  --cyan: #48d6ff;
  --good: #63d471;
  --f-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-num: "Chakra Petch", "Noto Sans TC", ui-monospace, sans-serif;
  color-scheme: dark;
}
html { overflow: hidden; overscroll-behavior: none; height: 100%; }
body {
  height: 100%; background: var(--bg); color: var(--fg); font-family: var(--f-ui); overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; touch-action: none;
}
button { font-family: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#app { position: relative; height: 100%; max-width: 640px; margin: 0 auto; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* scoreboard */
.hud {
  position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: start;
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); pointer-events: none;
}
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px 8px; min-width: 0; }
.side.op { text-align: right; }
.side .nm { font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side .nm small { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); letter-spacing: .06em; }
.side .rpm { font-family: var(--f-num); font-size: 22px; font-weight: 700; line-height: 1.1; margin-top: 2px; font-variant-numeric: tabular-nums; }
.side .rpm span { font-size: 11px; color: var(--muted); margin-left: 3px; }
.bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--c, var(--gold)); transition: width .15s linear; }
.side.op .bar i { margin-left: auto; }
.pts { display: flex; gap: 4px; margin-top: 6px; }
.side.op .pts { justify-content: flex-end; }
.pts b { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--c, var(--gold)); }
.pts b.on { background: var(--c, var(--gold)); box-shadow: 0 0 8px var(--c, var(--gold)); }
.vs { font-family: var(--f-num); font-weight: 700; font-size: 18px; color: var(--gold); padding-top: 18px; text-shadow: 0 0 10px rgba(255, 201, 60, .5); }
.vs small { display: block; font-size: 11px; letter-spacing: .12em; color: var(--muted); text-align: center; margin-top: 2px; text-shadow: none; }

/* banner, countdown */
.banner {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; width: 92%;
  font-weight: 900; font-size: clamp(40px, 13vw, 72px); line-height: 1.05; letter-spacing: .04em; color: var(--fg);
  text-shadow: 0 4px 0 rgba(0, 0, 0, .4), 0 0 26px rgba(255, 201, 60, .45); animation: slam .5s cubic-bezier(.2, 1.6, .4, 1);
}
.banner small { display: block; font-size: .32em; font-weight: 700; color: var(--gold); letter-spacing: .12em; margin-top: 10px; text-shadow: none; }
.banner.go { color: var(--gold); }
@keyframes slam { from { transform: translate(-50%, -50%) scale(1.8); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
.toast { position: absolute; left: 50%; top: 56%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: 16px; pointer-events: none; white-space: nowrap; animation: fadeup 1.4s ease-out forwards; }
.toast.good { color: var(--good); } .toast.bad { color: var(--red); }
@keyframes fadeup { 0% { opacity: 0; transform: translate(-50%, 10px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -16px); } }

/* launch control */
.launch {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(66px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
}
.launch .tip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; font-weight: 700; text-align: center; }
.meter { width: min(320px, 80%); height: 14px; border-radius: 7px; background: rgba(255, 255, 255, .12); border: 1px solid var(--line); overflow: hidden; position: relative; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--cyan), var(--gold) 70%, var(--red)); }
.meter-l { font-family: var(--f-num); font-size: 12px; color: var(--muted); letter-spacing: .2em; }

/* screens */
.screen {
  position: absolute; inset: 0; z-index: 10; overflow-y: auto; touch-action: pan-y;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgba(18, 18, 42, .55), rgba(18, 18, 42, .92) 45%);
}
.logo { margin-top: 8px; text-align: center; }
.logo h1 { margin: 0; font-size: clamp(42px, 13vw, 64px); font-weight: 900; letter-spacing: .14em; line-height: 1; background: linear-gradient(180deg, #fff 30%, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .5)); }
.logo p { margin: 8px 0 0; font-family: var(--f-num); letter-spacing: .4em; color: var(--muted); font-size: 12px; }
.sec { width: min(560px, 100%); }
.sec h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .2em; color: var(--muted); font-weight: 700; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card {
  position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 4px; text-align: left; padding: 8px 10px 10px;
  background: var(--panel); border: 2px solid var(--line); border-radius: 14px; color: var(--fg);
}
.card.sel { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 0 22px color-mix(in srgb, var(--c) 45%, transparent); }
.card img { width: 100%; aspect-ratio: 1; object-fit: contain; }
.card b { font-size: 17px; font-weight: 900; }
.card .ty { font-size: 11.5px; color: var(--muted); }
.card .ty em { font-style: normal; color: var(--c); font-weight: 700; }
.stats { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 6px; align-items: center; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
.stats .bar { margin: 0; height: 5px; }
.opp { display: flex; gap: 6px; flex-wrap: wrap; }
.opp button { flex: 1 1 auto; min-width: 64px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-weight: 700; font-size: 13.5px; }
.opp button.sel { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.cta {
  width: min(560px, 100%); height: 56px; border: 0; border-radius: 14px; background: var(--gold); color: #1a1408;
  font-weight: 900; font-size: 21px; letter-spacing: .2em; box-shadow: 0 5px 0 #b3851a, 0 0 30px rgba(255, 201, 60, .35);
}
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #b3851a; }
.cta.alt { background: var(--panel); color: var(--fg); border: 1px solid var(--line); box-shadow: none; height: 48px; font-size: 17px; }
.rec { font-family: var(--f-num); font-size: 13px; color: var(--muted); letter-spacing: .1em; }
.howto { width: min(560px, 100%); font-size: 13.5px; line-height: 1.65; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.howto b { color: var(--fg); }
.result { justify-content: center; }
.result .big { font-size: clamp(44px, 14vw, 76px); font-weight: 900; letter-spacing: .1em; }
.result .score { font-family: var(--f-num); font-size: 40px; font-weight: 700; color: var(--gold); }
.result p { margin: 0; color: var(--muted); text-align: center; max-width: 34ch; line-height: 1.6; }
.icon-btn { position: absolute; z-index: 5; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 15px; display: grid; place-items: center; padding: 0; }
#btn-menu { left: max(12px, env(safe-area-inset-left, 0px)); }
#btn-mute { right: max(12px, env(safe-area-inset-right, 0px)); }
.next { position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(320px, 80%); }
@media (prefers-reduced-motion: reduce) { .banner, .toast { animation: none; } }
</style>

<div id="app">
  <canvas id="gl"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="side me" id="side0"><div class="nm" id="nm0">—</div><div class="rpm"><b id="rpm0">0</b><span>RPM</span></div><div class="bar"><i id="bar0"></i></div><div class="pts" id="pts0"></div></div>
    <div class="vs">VS<small id="round-lbl">R1</small></div>

  </div>
  <button class="icon-btn" id="btn-mute" type="button" aria-label="關閉聲音" hidden>♪</button>
  <button class="icon-btn" id="btn-menu" type="button" aria-label="回主畫面" hidden>☰</button>
  <div id="fx-layer"></div>

  <div class="launch" id="launch" hidden>

  </div>
  <button type="button" class="cta next" id="btn-next" hidden>下一回合</button>

  <div class="screen" id="scr-home">
    <div class="logo"><h1>陀螺鬥場</h1><p>SPIN · CLASH · BURST</p></div>
    <div class="sec"><h2>選你的陀螺</h2><div class="cards" id="cards"></div></div>
    <div class="sec"><h2>對手</h2><div class="opp" id="opp"></div></div>
    <button type="button" class="cta" id="btn-start">開始對戰</button>
    <div class="howto">
      <b>發射</b>：倒數時按住畫面往下拉蓄力，左右移動瞄準方向，「發射！」那一刻放開最強。<br>
      <b>得分</b>：對手先停轉＝旋轉終結 1 分；撞出場外＝場外終結 2 分；撞到散開＝爆裂終結 2 分。先拿 3 分獲勝。<br>
      <b>對戰中</b>：左右拖曳可以轉動視角。
    </div>
    <div class="rec" id="rec"></div>
  </div>

  <div class="screen result" id="scr-result" hidden>
    <div class="big" id="res-big">勝利</div>
    <div class="score" id="res-score">3 : 1</div>
    <p id="res-text"></p>
    <button type="button" class="cta" id="btn-again">再戰一場</button>
    <button type="button" class="cta alt" id="btn-home">換陀螺</button>
  </div>
</div>

    AU.hum = [0, 1].map(() => {   // one whirring voice per top: pitch follows spin
      const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
      o.type = 'sawtooth'; o.frequency.value = 100; f.type = 'bandpass'; f.Q.value = 1.4; f.frequency.value = 900; g.gain.value = 0;
      o.connect(f); f.connect(g); g.connect(master); o.start(); return { o, f, g };
    });
  } catch (e) { AU.ctx = null; }
}
function noise(dur, f0, f1, vol, type) {
  if (!AU.ctx || AU.muted) return; const c = AU.ctx, t = c.currentTime, s = c.createBufferSource(); s.buffer = AU.noise;
  const f = c.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = 2;
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(AU.master); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
}
function ping(freq, dur, vol, type) {
  if (!AU.ctx || AU.muted) return; const c = AU.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * .7, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(AU.master); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  clash(k) { noise(.12 + k * .1, 5000, 1500, .25 + k * .5, 'highpass'); ping(rand(1800, 3200), .25 + k * .3, .08 + k * .18); ping(rand(600, 900), .15, .05 + k * .1, 'square'); },
  wall(k) { noise(.15, 600, 200, .15 + k * .3); },
  land() { noise(.1, 1200, 400, .12); },
  launch() { noise(.5, 800, 5000, .4); },
  fall() { noise(.4, 900, 200, .2); ping(220, .4, .06, 'sine'); },
  burst() { noise(.5, 3000, 300, .7, 'lowpass'); ping(140, .5, .2, 'square'); ping(2400, .4, .15); },
  beep(hi) { ping(hi ? 1320 : 880, hi ? .5 : .15, .18, 'square'); },
  win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => ping(f, .3, .12, 'square'), i * 110)); },
};
function updateHum() {
  if (!AU.ctx) return;
  tops.forEach((t, i) => {
    const h = AU.hum[i]; if (!h) return; const k = t.alive && t.landed ? clamp(Math.abs(t.w) / 800, 0, 1) : 0, now = AU.ctx.currentTime;
    h.o.frequency.setTargetAtTime(60 + Math.abs(t.w) * .55, now, .05); h.f.frequency.setTargetAtTime(500 + Math.abs(t.w) * 2.5, now, .05);
    h.g.gain.setTargetAtTime(AU.muted ? 0 : k * .05, now, .08);
  });
}

// ======================= game flow =======================
const ui = { mine: 0, opp: 'rand' };
try { const s = JSON.parse(localStorage.getItem('tops-prefs') || 'null'); if (s) Object.assign(ui, s); } catch (e) {}
let rec = { w: 0, l: 0 };
try { rec = JSON.parse(localStorage.getItem('tops-rec') || 'null') || rec; } catch (e) {}
const M = { phase: 'home', pts: [0, 0], round: 0, t: 0, goAt: 0, timeScale: 1, slowT: 0, demo: true, pull: null, released: false, aim: 0, power: 0, endT: 0, firstHit: false };
const START = [[-1.35, 1.25], [1.35, -1.25]];

function setTops(a, b) {
  for (const t of tops) t.dispose();
  tops = [new Top(TOPS[a], 0), new Top(TOPS[b], 1)];
}
function placeForLaunch() {
  tops.forEach((t, i) => { t.reset(START[i][0], START[i][1]); t.y = .75; });
}
function slowmo(sec) { M.slowT = Math.max(M.slowT, sec); }
function banner(html, cls, ms) {
  document.querySelectorAll('.banner').forEach((e) => e.remove());
  const el = document.createElement('div'); el.className = 'banner' + (cls ? ' ' + cls : ''); el.innerHTML = html; $('#fx-layer').appendChild(el);
  if (ms) setTimeout(() => el.remove(), ms);
  return el;
}
function toast(text, cls) {
  const el = document.createElement('div'); el.className = 'toast' + (cls ? ' ' + cls : ''); el.textContent = text; $('#fx-layer').appendChild(el); setTimeout(() => el.remove(), 1500);
}
function renderHud() {
  tops.forEach((t, i) => {
    const p = t.p, c = '#' + new THREE.Color(p.color).getHexString();
    $('#side' + i).style.setProperty('--c', c);
    $('#nm' + i).innerHTML = `${p.name}<small>${p.type}・${p.dir > 0 ? '右旋' : '左旋'}${i === 0 ? '・你' : ''}</small>`;
    $('#pts' + i).innerHTML = [0, 1, 2].map((k) => `<b class="${M.pts[i] > k ? 'on' : ''}"></b>`).join('');
  });
  $('#round-lbl').textContent = `R${M.round}`;
}
function startMatch() {
  initAudio();
  const opp = ui.opp === 'rand' ? Math.floor(Math.random() * TOPS.length) : +ui.opp;
  setTops(ui.mine, opp);
  M.demo = false; M.pts = [0, 0]; M.round = 0;
  $('#scr-home').hidden = true; $('#scr-result').hidden = true;
  $('#hud').hidden = false; $('#btn-menu').hidden = false; $('#btn-mute').hidden = false;
  startRound();
}
function startRound() {
  M.round++; M.phase = 'ready'; M.t = 0; M.goAt = 3.2; M.pull = null; M.released = false; M.power = 0; M.aim = 0; M.relT = null; M.endT = 0;
  M.oppLaunch = { power: rand(.72, 1), t: M.goAt + (Math.random() < .6 ? rand(-.12, .12) : rand(-.4, .5)), aim: rand(-25, 25) };
  placeForLaunch(); renderHud(); $('#btn-next').hidden = true;
  $('#launch').hidden = false; $('#meter').style.width = '0%';
  $('#launch-tip').textContent = '按住畫面往下拉蓄力、左右瞄準，喊「發射」時放開！';
  M.count = -1; camAng = 0;
}
function doLaunch(t, power, aim) { launchTop(t, power, aim); if (t.side === 0) sfx.launch(); }
function endRound(winner, how) {
  M.phase = 'roundEnd'; M.endT = 0;
  const pts = how === 'spin' ? 1 : 2, names = { spin: '旋轉終結', out: '場外終結', burst: '爆裂終結', draw: '平手' };
  if (winner >= 0) M.pts[winner] = Math.min(3, M.pts[winner] + pts);
  renderHud();
  if (winner < 0) banner(`平手<small>兩顆同時停下</small>`, '', 0);
  else banner(`${names[how]}<small>${tops[winner].p.name} +${pts} 分</small>`, winner === 0 ? 'go' : '', 0);
  if (winner === 0) sfx.win(); else sfx.fall();
  setTimeout(() => {
    if (M.phase !== 'roundEnd') return;
    if (M.pts[0] >= 3 || M.pts[1] >= 3) showResult();
    else { $('#btn-next').hidden = false; }
  }, 1800);
}
function showResult() {
  const win = M.pts[0] >= 3;
  if (win) rec.w++; else rec.l++;
  try { localStorage.setItem('tops-rec', JSON.stringify(rec)); } catch (e) {}
  document.querySelectorAll('.banner').forEach((e) => e.remove());
  $('#res-big').textContent = win ? '勝利！' : '敗北…';
  $('#res-big').style.color = win ? 'var(--gold)' : 'var(--red)';
  $('#res-score').textContent = `${M.pts[0]} : ${M.pts[1]}`;
  $('#res-text').textContent = win ? `${tops[0].p.name}稱霸鬥場！再挑戰一場，或換一顆陀螺試試別的打法。` : `${tops[1].p.name}比較強……換個發射角度，或抓準「發射」的時機再來一次。`;
  $('#scr-result').hidden = false; $('#hud').hidden = true; $('#launch').hidden = true;
  M.phase = 'result';
}
function goHome() {
  document.querySelectorAll('.banner').forEach((e) => e.remove());
  M.phase = 'home'; M.demo = true;
  $('#scr-home').hidden = false; $('#scr-result').hidden = true; $('#hud').hidden = true;
  $('#launch').hidden = true; $('#btn-next').hidden = true; $('#btn-menu').hidden = true; $('#btn-mute').hidden = true;
  renderHome(); startDemo();
}
function startDemo() {
  const a = Math.floor(Math.random() * TOPS.length); let b = Math.floor(Math.random() * TOPS.length); if (b === a) b = (b + 1) % TOPS.length;
  setTops(a, b); placeForLaunch();
  tops.forEach((t) => launchTop(t, rand(.75, 1), rand(-20, 20)));
  M.endT = 0;
}

// ---- home screen ----
function thumb(p) {
  const S = new THREE.Scene(); S.environment = scene.environment;
  S.add(new THREE.HemisphereLight(col(0xffffff), col(0x303050), .8)); const d = new THREE.DirectionalLight(col(0xffffff), 1.6); d.position.set(-2, 4, 3); S.add(d);
  const m = buildTopMesh(p); m.blur.visible = false; m.tilt.rotation.x = .35; S.add(m.root);
  const cam = new THREE.PerspectiveCamera(30, 1, .1, 20); cam.position.set(0, 1.6, 2.25); cam.lookAt(0, .32, 0);
  const SZ = 192, rt = new THREE.WebGLRenderTarget(SZ, SZ); rt.texture.encoding = THREE.sRGBEncoding;
  const pc = new THREE.Color(), pa = renderer.getClearAlpha(); renderer.getClearColor(pc);
  const sm = renderer.shadowMap.enabled; renderer.shadowMap.enabled = false;
  renderer.setRenderTarget(rt); renderer.setClearColor(0, 0); renderer.clear(); renderer.render(S, cam);
  const buf = new Uint8Array(SZ * SZ * 4); renderer.readRenderTargetPixels(rt, 0, 0, SZ, SZ, buf);
  renderer.setRenderTarget(null); renderer.setClearColor(pc, pa); renderer.shadowMap.enabled = sm; rt.dispose();
  const c = document.createElement('canvas'); c.width = c.height = SZ; const g = c.getContext('2d'), img = g.createImageData(SZ, SZ);
  for (let y = 0; y < SZ; y++) img.data.set(buf.subarray((SZ - 1 - y) * SZ * 4, (SZ - y) * SZ * 4), y * SZ * 4);
  g.putImageData(img, 0, 0); return c.toDataURL();
}
const THUMBS = [];
function renderHome() {
  $('#cards').innerHTML = TOPS.map((p, i) => {
    const c = '#' + new THREE.Color(p.color).getHexString();
    const stats = STAT_LIST.map(([n, f]) => `<span>${n}</span><div class="bar"><i style="width:${Math.round(clamp(f(p), .08, 1) * 100)}%;--c:${c}"></i></div>`).join('');
    return `<button type="button" class="card${ui.mine === i ? ' sel' : ''}" data-i="${i}" style="--c:${c}"><img alt="" src="${THUMBS[i] || ''}"><b>${p.name}</b><span class="ty"><em>${p.type}</em>・${p.dir > 0 ? '右旋' : '左旋'}・${{ flat: '平頭軸', ball: '球形軸', sharp: '尖頭軸', semi: '半平軸' }[p.tip]}</span><div class="stats">${stats}</div></button>`;
  }).join('');
  $('#opp').innerHTML = [`<button type="button" data-o="rand" class="${ui.opp === 'rand' ? 'sel' : ''}">隨機</button>`].concat(TOPS.map((p, i) => `<button type="button" data-o="${i}" class="${String(ui.opp) === String(i) ? 'sel' : ''}">${p.name}</button>`)).join('');
  $('#rec').textContent = rec.w + rec.l ? `戰績 ${rec.w} 勝 ${rec.l} 敗` : '';
}
function savePrefs() { try { localStorage.setItem('tops-prefs', JSON.stringify(ui)); } catch (e) {} }
$('#cards').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (!b) return; ui.mine = +b.dataset.i; savePrefs(); renderHome(); });
$('#opp').addEventListener('click', (e) => { const b = e.target.closest('[data-o]'); if (!b) return; ui.opp = b.dataset.o; savePrefs(); renderHome(); });
$('#btn-start').addEventListener('click', startMatch);
$('#btn-again').addEventListener('click', startMatch);
$('#btn-home').addEventListener('click', goHome);
$('#btn-menu').addEventListener('click', goHome);
$('#btn-next').addEventListener('click', startRound);
$('#btn-mute').addEventListener('click', () => { AU.muted = !AU.muted; $('#btn-mute').textContent = AU.muted ? '✕' : '♪'; });

// ---- input: pull to launch; drag to orbit the camera during a battle ----
let drag = null;
const isUI = (e) => e.target.closest('button, .screen');
window.addEventListener('pointerdown', (e) => {
  if (isUI(e)) return;
  drag = { x: e.clientX, y: e.clientY, ang: camAng, id: e.pointerId };
  if (M.phase === 'ready' && !M.released) { initAudio(); M.pull = { x0: e.clientX, y0: e.clientY }; }
});
window.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (M.phase === 'ready' && M.pull && !M.released) {
    const H = innerHeight, W = innerWidth;
    M.power = clamp((e.clientY - M.pull.y0) / (H * .32), 0, 1);
    M.aim = clamp((e.clientX - M.pull.x0) / (W * .3), -1, 1) * 45;
    $('#meter').style.width = Math.round(M.power * 100) + '%';
  } else if (M.phase === 'battle' || M.phase === 'roundEnd' || M.phase === 'home') {
    camAng = drag.ang - (e.clientX - drag.x) / innerWidth * 3;
  }
});
function release(e) {
  if (!drag || e.pointerId !== drag.id) return;
  drag = null;
  if (M.phase === 'ready' && M.pull && !M.released) { M.released = true; M.relT = M.t; }
}
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
document.addEventListener('touchmove', (e) => { if (!e.target.closest('.screen')) e.preventDefault(); }, { passive: false });
for (const ev of ['gesturestart', 'gesturechange']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });

// ======================= main loop =======================
const aim = new THREE.Mesh(new THREE.ConeGeometry(.12, .5, 3), new THREE.MeshBasicMaterial({ color: col(0xffc93c), transparent: true, opacity: .9 }));
aim.rotation.x = PI / 2; const aimG = new THREE.Group(); aimG.add(aim); aim.position.z = .7; scene.add(aimG); aimG.visible = false;
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  camDist = Math.max(7.6, (RA * 1.12) / (Math.tan(camera.fov / 2 * PI / 180) * camera.aspect));
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas); resize();

let last = performance.now(), frameN = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const raw = Math.min(1 / 30, (now - last) / 1000); last = now; frameN++;
  if (M.slowT > 0) { M.slowT -= raw; M.timeScale = lerp(M.timeScale, .22, .3); } else M.timeScale = lerp(M.timeScale, 1, .12);
  const dt = raw * M.timeScale;
  M.t += raw;

  if (M.phase === 'ready') {
    // countdown: 3, 2, 1, launch
    const k = Math.floor(M.t - .2);
    if (k !== M.count && M.t >= .2 && k < 3) { M.count = k; banner(String(3 - k), '', 700); sfx.beep(false); }
    if (M.t >= M.goAt && M.count < 3) { M.count = 3; banner('發射！', 'go', 900); sfx.beep(true); }
    // player
    const me = tops[0];
    if (me.state === 'ready') {
      let fire = null;
      if (M.released && M.t >= M.goAt - .05) {
        const off = M.relT - M.goAt;
        let mul = 1, msg = '', cls = '';
        if (off < -.3) { mul = .72; msg = '太早放開了'; cls = 'bad'; }
        else if (off <= .2) { mul = 1.08; msg = '完美發射！'; cls = 'good'; }
        else { mul = Math.max(.55, 1 - (off - .2) * .7); msg = '慢了一點'; cls = 'bad'; }
        fire = clamp(Math.max(M.power, .2) * mul, .2, 1.08); toast(msg, cls);
      } else if (M.t > M.goAt + 1.3) { fire = Math.max(.3, M.power * .6); toast('太慢了！', 'bad'); }
      if (fire != null) { doLaunch(me, fire, M.aim); $('#launch').hidden = true; }
    }
    const op = tops[1];
    if (op.state === 'ready' && M.t >= Math.max(M.goAt - .05, M.oppLaunch.t)) doLaunch(op, M.oppLaunch.power, M.oppLaunch.aim);
    if (me.state !== 'ready' && op.state !== 'ready') { M.phase = 'battle'; M.battleT = 0; }
    // aim arrow while pulling
    aimG.visible = me.state === 'ready';
    if (aimG.visible) {
      const toC = Math.atan2(-me.z, -me.x), a = toC + (55 + M.aim) * PI / 180 * -1;
      aimG.position.set(me.x, bowlH(Math.hypot(me.x, me.z)) + .05, me.z); aimG.rotation.y = -a + PI / 2;
      aim.scale.setScalar(.6 + M.power * .9);
    }
  } else aimG.visible = false;

  // physics in small steps
  if (M.phase === 'battle' || M.phase === 'roundEnd' || (M.phase === 'home' && M.demo) || M.phase === 'result' || M.phase === 'ready') {
    const sub = 4, h = dt / sub;
    for (let s = 0; s < sub; s++) {
      for (const t of tops) { if (t.state !== 'ready') stepTop(t, h); t.cool = Math.max(0, (t.cool || 0) - h); }
      if (tops.length === 2) collide(tops[0], tops[1]);
    }
  }
  for (const t of tops) {
    if (t.state === 'ready') { t.m.root.position.set(t.x, t.y, t.z); t.m.tilt.quaternion.identity(); t.vis += dt * 2; t.m.spin.rotation.y = t.vis; t.m.blur.material.opacity = 0; }
    else drawTop(t, dt);
  }
  sparks.update(dt);

  // decide the round
  if (M.phase === 'battle') {
    M.battleT += dt;
    const [a, b] = tops, da = !a.alive, db = !b.alive;
    if (da || db) {
      if (da && db) endRound(-1, 'draw');
      else { const loser = da ? a : b, winner = da ? 1 : 0; endRound(winner, loser.state === 'fallen' ? 'spin' : loser.state); }
    }
  }
  if (M.phase === 'home' && M.demo) {
    if (tops.some((t) => !t.alive && t.state !== 'ready')) { M.endT += raw; if (M.endT > 2.5) startDemo(); }
    camAng += raw * .12;
  }

  // HUD
  if (frameN % 4 === 0 && !$('#hud').hidden) tops.forEach((t, i) => {
    $('#rpm' + i).textContent = t.alive ? Math.round(RPM(t.w)).toLocaleString('en-US') : (t.state === 'ready' ? '0' : '—');
    $('#bar' + i).style.width = clamp(Math.abs(t.alive ? t.w : 0) / 860 * 100, 0, 100) + '%';
  });
  updateHum();

  // camera: orbit around the bowl, with a little shake on big hits
  shake *= Math.pow(.02, raw);
  const cx = Math.sin(camAng) * camDist * .5, cz = Math.cos(camAng) * camDist * .5;
  camera.position.set(cx + rand(-1, 1) * shake, camDist * .87 + rand(-1, 1) * shake, cz + rand(-1, 1) * shake);
  camera.lookAt(0, -.15, 0);
  renderer.render(scene, camera);
}

// build the card thumbnails once fonts are in, then show the home screen with a demo battle behind it
const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(() => { TOPS.forEach((p, i) => { THUMBS[i] = thumb(p); }); renderHome(); });
goHome();
requestAnimationFrame(loop);
})();
</script>
