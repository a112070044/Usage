<title>阿師快炒</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout: one-screen portrait game column. Order tickets clip on a rail at the top, the wok stage fills the middle, the ingredient rack sits at the bottom. A night-time stir-fry shop: dark kitchen, red signboard, paper order slips. */
:root {
  --bg: #120e0c;
  --stage: #1c1512;
  --panel: #231a15;
  --line: #3b2e26;
  --paper: #f5eddc;
  --paper-line: #cdbb9b;
  --ink: #2b1d13;
  --ink-soft: #6a5443;
  --sign: #d4352b;
  --sign-glow: rgba(212, 53, 43, .45);
  --lamp: #f1b23c;
  --fg: #f4e7d3;
  --muted: #a69079;
  --good: #5fae4a;
  --warn: #e7a23a;
  --bad: #e0533e;
  --glass: rgba(18, 13, 10, .74);
  --glass-line: rgba(255, 228, 196, .14);
  --rack: #efe4cf;
  --f-sign: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-hand: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "Noto Sans TC", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-ui);
  overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
#app {
  position: relative; height: 100%; max-width: 540px; margin: 0 auto; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
}

/* ---------- header ---------- */
header { display: flex; align-items: center; gap: 10px; min-height: 34px; }
.sign {
  font-family: var(--f-sign); font-weight: 900; font-size: 19px; letter-spacing: .14em;
  color: var(--paper); background: var(--sign); padding: 2px 6px 2px 10px; border-radius: 4px;
  box-shadow: 0 0 18px var(--sign-glow), inset 0 0 0 2px rgba(255, 220, 180, .22);
  white-space: nowrap;
}
.hud { margin-left: auto; display: flex; gap: 12px; align-items: center; font-variant-numeric: tabular-nums; }
.hud .k { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.05; }
.hud .k span { font-size: 10px; color: var(--muted); letter-spacing: .08em; }
.hud .k b { font-size: 16px; font-weight: 700; }
#hearts { color: var(--sign); letter-spacing: 1px; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  color: var(--fg); font-size: 14px; display: grid; place-items: center; padding: 0;
}

/* ---------- order rail ---------- */
.rail-wrap { position: relative; }
.rail-wrap::before {
  content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 4px; border-radius: 2px;
  background: linear-gradient(var(--line), #4b3b31); z-index: 0;
}
.rail {
  position: relative; z-index: 1; display: flex; gap: 8px; overflow-x: auto; min-height: 118px;
  scrollbar-width: none; padding-top: 0;
}
.rail::-webkit-scrollbar { display: none; }
.rail-empty { color: var(--muted); font-size: 13px; align-self: center; padding: 14px 4px 0; font-family: var(--f-hand); }
.ticket {
  flex: 0 0 118px; position: relative; text-align: left; border: 0; margin-top: 6px;
  background: var(--paper); color: var(--ink); border-radius: 2px 2px 4px 4px;
  padding: 10px 8px 12px; font-family: var(--f-hand);
  box-shadow: 0 3px 0 rgba(0, 0, 0, .35);
  transform-origin: top center; animation: drop .45s cubic-bezier(.3, 1.6, .5, 1);
}
.ticket::before {
  content: ""; position: absolute; top: -6px; left: 50%; width: 26px; height: 9px; margin-left: -13px;
  background: #8b8f94; border-radius: 2px; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25);
}
.ticket.sel { box-shadow: 0 0 0 3px var(--lamp), 0 3px 0 rgba(0, 0, 0, .35); }
.ticket.urgent { animation: shake .5s infinite; }
.t-head { display: flex; justify-content: space-between; font-family: var(--f-ui); font-size: 11px; font-weight: 700; color: var(--sign); border-bottom: 1px dashed var(--paper-line); padding-bottom: 3px; }
.t-head em { font-style: normal; color: var(--ink-soft); font-weight: 500; }
.t-dish { font-size: 19px; font-weight: 700; margin: 4px 0 3px; line-height: 1.1; }
.t-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0 6px; font-size: 12.5px; line-height: 1.35; color: var(--ink-soft); }
.t-list li.s { color: #9a5a1e; }
.t-list li.ok { color: var(--good); text-decoration: line-through; }
.t-bar { position: absolute; left: 8px; right: 8px; bottom: 5px; height: 3px; border-radius: 2px; background: var(--paper-line); overflow: hidden; }
.t-bar i { display: block; height: 100%; background: var(--good); border-radius: 2px; }

/* ---------- stage ---------- */
#stage { position: relative; flex: 1; min-height: 210px; border-radius: 14px; overflow: hidden; background: var(--stage); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.chips { position: absolute; left: 10px; top: 10px; display: grid; grid-template-columns: auto auto; gap: 4px; pointer-events: none; }
.chip {
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 6px;
  padding: 3px 7px 4px; min-width: 64px; display: flex; flex-direction: column; line-height: 1.15;
}
.chip span { font-size: 10px; color: var(--muted); letter-spacing: .08em; }
.chip b { font-size: 14px; font-variant-numeric: tabular-nums; font-weight: 700; }
.chip .meter { height: 3px; margin-top: 3px; border-radius: 2px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.chip .meter i { display: block; height: 100%; width: 0; background: var(--lamp); }
.heat { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 5px; align-items: center; }
.heat .lbl { font-size: 10px; color: var(--muted); letter-spacing: .1em; }
.heat button {
  width: 40px; height: 34px; border-radius: 8px; border: 1px solid var(--glass-line);
  background: var(--glass); color: var(--fg); font-weight: 700; font-size: 15px; padding: 0;
}
.heat button.on { background: var(--lamp); color: var(--ink); border-color: var(--lamp); box-shadow: 0 0 14px rgba(241, 178, 60, .45); }
.heat button[data-f="0"].on { background: var(--muted); border-color: var(--muted); box-shadow: none; }
.acts { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
.acts button { pointer-events: auto; }
#dump {
  height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--glass-line);
  background: var(--glass); color: var(--fg); font-weight: 700; font-size: 14px;
}
#serve {
  height: 52px; padding: 0 22px; border-radius: 12px; border: 0;
  background: var(--sign); color: var(--paper); font-weight: 900; font-size: 20px; letter-spacing: .12em;
  box-shadow: 0 4px 0 #8c1f18, 0 0 22px var(--sign-glow);
}
#serve:active { transform: translateY(3px); box-shadow: 0 1px 0 #8c1f18; }
#serve small { display: block; font-size: 10px; font-weight: 500; letter-spacing: .04em; opacity: .85; margin-top: -2px; }
.hint {
  position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); pointer-events: none;
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px;
  padding: 4px 12px; font-size: 13px; white-space: nowrap; animation: bob 1.6s ease-in-out infinite;
}
.pops { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pop {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
  font-weight: 900; font-size: 19px; color: var(--paper); white-space: nowrap;
  background: rgba(46, 26, 12, .78); border: 1px solid rgba(255, 210, 150, .25);
  padding: 4px 14px; border-radius: 999px; animation: pop 1.4s ease-out forwards;
}
.pop.hot { color: var(--lamp); font-size: 22px; }
.pop.bad { color: #ffb4a6; }
.result {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(280px, 82%);
  background: var(--paper); color: var(--ink); border-radius: 6px; padding: 12px 14px 14px;
  font-family: var(--f-hand); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); animation: card 2.6s ease forwards;
  pointer-events: none;
}
.result h3 { margin: 0; font-size: 22px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; text-wrap: balance; }
.result .stars { color: var(--sign); font-size: 20px; letter-spacing: 2px; }
.result .pay { font-family: var(--f-ui); font-weight: 700; font-size: 14px; color: var(--good); margin: 4px 0 6px; }
.result .pay.no { color: var(--bad); }
.result p { margin: 2px 0 0; font-size: 15px; line-height: 1.4; }

/* ---------- rack ---------- */
.rack { display: flex; flex-direction: column; gap: 6px; }
.tabs { display: flex; gap: 6px; }
.tabs button {
  flex: 1; height: 32px; border-radius: 8px 8px 0 0; border: 1px solid var(--line); border-bottom: 0;
  background: var(--panel); color: var(--muted); font-weight: 700; font-size: 14px; position: relative;
}
.tabs button.on { background: var(--rack); color: var(--ink); border-color: var(--rack); }
.tabs button .dot { position: absolute; top: 6px; right: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--sign); }
.grid { display: grid; gap: 6px; grid-template-columns: repeat(5, minmax(0, 1fr)); align-content: start; height: calc(3 * 60px + 2 * 6px); }
.grid.seas { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: calc((3 * 60px + 6px) / 2); }
.item {
  position: relative; height: 60px; border-radius: 10px; border: 0; background: var(--rack); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 2px 0 4px;
  font-size: 12px; font-weight: 700; transition: transform .08s;
}
.grid.seas .item { height: 100%; font-size: 13px; }
.item img { width: 40px; height: 40px; pointer-events: none; }
.grid.seas .item img { width: 50px; height: 50px; }
.item:active { transform: scale(.93); }
.item .need { position: absolute; top: 5px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--sign); box-shadow: 0 0 0 2px var(--rack); }
.item .cnt { position: absolute; top: 3px; left: 6px; font-size: 11px; color: var(--good); font-family: var(--f-ui); }

/* ---------- overlays ---------- */
.screen {
  position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
  background: rgba(10, 7, 6, .72); backdrop-filter: blur(2px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.board {
  width: min(380px, 100%); background: var(--paper); color: var(--ink); border-radius: 6px;
  padding: 20px 20px 18px; font-family: var(--f-hand); box-shadow: 0 16px 40px rgba(0, 0, 0, .55);
  display: flex; flex-direction: column; gap: 10px;
}
.board .sign { align-self: flex-start; font-size: 26px; }
.board h2 { margin: 0; font-size: 22px; text-wrap: balance; }
.board p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--ink-soft); }
.board ol { margin: 0; padding-left: 1.3em; font-size: 16px; line-height: 1.6; }
.board .menu { font-size: 14px; color: var(--ink-soft); border-top: 1px dashed var(--paper-line); padding-top: 8px; line-height: 1.6; }
.board .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-family: var(--f-ui); }
.board .stats div { border: 1px dashed var(--paper-line); border-radius: 4px; padding: 6px 8px; }
.board .stats span { display: block; font-size: 11px; color: var(--ink-soft); letter-spacing: .06em; }
.board .stats b { font-size: 20px; font-variant-numeric: tabular-nums; }
.board .big {
  margin-top: 4px; height: 50px; border: 0; border-radius: 10px; background: var(--sign); color: var(--paper);
  font-family: var(--f-ui); font-weight: 900; font-size: 19px; letter-spacing: .16em; box-shadow: 0 4px 0 #8c1f18;
}
.board .big:active { transform: translateY(3px); box-shadow: 0 1px 0 #8c1f18; }
.board .best { font-family: var(--f-ui); font-size: 13px; color: var(--ink-soft); text-align: center; }

@keyframes drop { from { transform: translateY(-30px) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -120%); } }
@keyframes card { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.9); } 10% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 82% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%); } }
@keyframes bob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -5px); } }
@media (prefers-reduced-motion: reduce) {
  .ticket, .ticket.urgent, .hint { animation: none; }
  .pop { animation: fade 1.4s forwards; }
  .result { animation: fade 2.6s forwards; }
  @keyframes fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
}
@media (max-height: 700px) {
  .rail { min-height: 104px; }
  .t-dish { font-size: 17px; }
  .grid { height: calc(3 * 52px + 2 * 6px); }
  .item { height: 52px; }
  .grid.seas { grid-auto-rows: calc((3 * 52px + 6px) / 2); }
  .item img { width: 34px; height: 34px; }
  .grid.seas .item img { width: 42px; height: 42px; }
}
</style>

<div id="app">
  <header>
    <div class="sign">阿師快炒</div>
    <div class="hud">
      <div class="k"><span>時間</span><b id="clock">17:00</b></div>
      <div class="k"><span>收入</span><b id="money">$0</b></div>
      <div class="k"><span>口碑</span><b id="hearts">♥♥♥</b></div>
      <button class="icon-btn" id="mute" type="button" aria-label="關閉聲音">♪</button>
      <button class="icon-btn" id="pause" type="button" aria-label="暫停">❚❚</button>
    </div>
  </header>

  <div class="rail-wrap"><div class="rail" id="rail"><div class="rail-empty">還沒有客人，先熱鍋吧。</div></div></div>

  <div id="stage">
    <canvas id="gl"></canvas>
    <div class="chips">
      <div class="chip"><span>鍋溫</span><b id="c-temp">25°C</b><div class="meter"><i id="m-temp"></i></div></div>
      <div class="chip"><span>熟度</span><b id="c-cook">—</b><div class="meter"><i id="m-cook"></i></div></div>
      <div class="chip"><span>拌勻</span><b id="c-mix">—</b><div class="meter"><i id="m-mix"></i></div></div>
      <div class="chip"><span>鍋氣</span><b id="c-wh">0.0</b><div class="meter"><i id="m-wh"></i></div></div>
    </div>
    <div class="heat" id="heat">
      <div class="lbl">火力</div>
      <button type="button" data-f="3">大</button>
      <button type="button" data-f="2" class="on">中</button>
      <button type="button" data-f="1">小</button>
      <button type="button" data-f="0">關</button>
    </div>
    <div class="hint" id="hint">在鍋子上往上滑＝甩鍋</div>
    <div class="pops" id="pops"></div>
    <div class="acts">
      <button type="button" id="dump">倒掉</button>
      <button type="button" id="serve">出菜！<small id="serve-to">先選一張單</small></button>
    </div>
  </div>

  <div class="rack">
    <div class="tabs">
      <button type="button" class="on" data-tab="food">食材<i class="dot" id="dot-food" hidden></i></button>
      <button type="button" data-tab="seas">油・調味<i class="dot" id="dot-seas" hidden></i></button>
    </div>
    <div class="grid" id="grid-food"></div>
    <div class="grid seas" id="grid-seas" hidden></div>
  </div>

  <div class="screen" id="scr-start">
    <div class="board">
      <div class="sign">阿師快炒</div>
      <h2>晚上五點開店，客人會一直點菜。</h2>
      <ol>
        <li>看上面的點菜單，點一下選你要炒的那張。</li>
        <li>開火、下油，照單把料和調味下鍋（紅點＝還缺的）。</li>
        <li>在鍋子上往上滑甩鍋，炒熟、拌勻，大火甩出鍋氣。</li>
        <li>按「出菜」。等太久或太難吃，口碑會掉。</li>
      </ol>
      <div class="menu">今晚菜單：蛋炒飯・炒高麗菜・蝦仁炒蛋・沙茶牛肉・宮保雞丁・三杯雞</div>
      <button type="button" class="big" id="btn-start">開店</button>
      <div class="best" id="best-start"></div>
    </div>
  </div>

  <div class="screen" id="scr-end" hidden>
    <div class="board">
      <div class="sign">打烊</div>
      <h2 id="end-title">今天辛苦了！</h2>
      <div class="stats">
        <div><span>收入</span><b id="e-money">$0</b></div>
        <div><span>出菜</span><b id="e-served">0 道</b></div>
        <div><span>平均評價</span><b id="e-avg">—</b></div>
        <div><span>跑掉的客人</span><b id="e-missed">0 桌</b></div>
      </div>
      <p id="end-note"></p>
      <button type="button" class="big" id="btn-again">明天再開店</button>
      <div class="best" id="best-end"></div>
    </div>
  </div>

  <div class="screen" id="scr-pause" hidden>
    <div class="board">
      <h2>休息一下</h2>
      <p>客人和鍋子都會等你。</p>
      <button type="button" class="big" id="btn-resume">繼續</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  W.oils[k] = (W.oils[k] || 0) + 1; W.oil += 1; W.oilKind = k;
  oilMat.color.copy(col(d.c));
  W.T = Math.max(25, W.T - 4);
  pour(d.c, 80, false);
  sizzleBoost = Math.min(1, sizzleBoost + .4);
  whoosh(0.6, 2600, 0.3);
  refreshNeeds();
}
function coat(si, frac) {
  for (const k of FOOD_KEYS) {
    const f = FOODS[k];
    for (let i = 0; i < f.n; i++) if (f.st[i] === 0 && Math.random() < frac) f.coat[i * NS + si] = 1;
  }
}
function addSeas(k) {
  const d = SEAS[k];
  W.sauces[k] = (W.sauces[k] || 0) + 1;
  pour(d.c, d.kind === 'dry' ? 60 : 90, d.kind === 'dry');
  if (d.kind !== 'dry') {
    W.T = Math.max(25, W.T - 8); sizzleBoost = 1; whoosh(0.8, 2200, 0.45);
    for (let i = 0; i < 24; i++) steam.emit(rand(-.8, .8), 0.5, rand(-.8, .8), rand(-.3, .3), rand(.8, 1.6), rand(-.3, .3), rand(1.4, 2.4), new THREE.Color(1, .95, .9));
  } else sfx.click();
  setTimeout(() => coat(SI[k], 0.2), 400);
  if (k === 'wine' && W.T > 200) {
    W.wh += 0.6; pop('米酒嗆鍋！', 'hot');
    burstFlare(160, 1.4);
  }
  refreshNeeds();
}
function burstFlare(n, h) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * PI * 2, r = Math.sqrt(Math.random()) * 1.3;
    flare.emit(wok.position.x + Math.cos(a) * r, wok.position.y + 0.3 + Math.random() * .3, wok.position.z + Math.sin(a) * r,
      gauss() * .8, rand(1.5, 3.5) * h, gauss() * .8, rand(.35, .7), new THREE.Color(1, rand(.45, .65), .15));
  }
  flareLight.intensity = Math.max(flareLight.intensity, 4 * h);
}
function contentsCount() { let n = 0; for (const k of FOOD_KEYS) n += FOODS[k].n; return n; }
function toss(power) {
  if (!G.running || G.paused) return;
  if (G.t - W.lastToss < 0.32) return;
  W.lastToss = G.t; W.tossAnim = 0; W.tossPow = power; W.impulse = false;
  sfx.toss();
  if (!G.tossed) { G.tossed = true; $('#hint').hidden = true; }
}
function applyToss(power) {
  const up = 4.0 + power * 2.0, spread = 1.0 + Math.max(0, power - 1.15) * 5;
  let moved = 0;
  for (const k of FOOD_KEYS) {
    const f = FOODS[k], p = f.p, v = f.v, big = ING[k].size[0] > .2 ? 1.15 : 1;
    for (let i = 0; i < f.n; i++) {
      if (f.st[i] !== 0 || p[i * 3 + 1] > RIMY) continue;
      const j = i * 3;
      v[j + 1] += up * rand(.8, 1.15);
      v[j] += -p[j] * .45 + rand(-.5, .5) * spread * big;
      v[j + 2] += -p[j + 2] * .45 + rand(-.5, .5) * spread * big - .25;
      f.w[j] = rand(-12, 12); f.w[j + 2] = rand(-12, 12);
      f.layer[i] = Math.random(); f.on[i] = 0; moved++;
    }
  }
  for (const s in W.sauces) coat(SI[s], 0.4);
  if (moved && W.T > 230 && W.oil > 0.1) {
    const gain = (W.T - 230) / 70 * power * 0.5;
    W.wh += gain;
    burstFlare(Math.round(30 + gain * 160), 0.8 + gain);
    if (gain > 0.25) pop('鍋氣！', 'hot');
  }
}

// ======================= orders & scoring =======================
function unlocked() { return DISHES.filter((d) => d.unlock <= G.t); }
function spawnOrder() {
  const pool = unlocked(), tot = pool.reduce((a, d) => a + d.w, 0);
  let r = Math.random() * tot, dish = pool[0];
  for (const d of pool) { r -= d.w; if (r <= 0) { dish = d; break; } }
  const used = new Set(G.tickets.map((t) => t.table));
  let table; do { table = 1 + Math.floor(Math.random() * 12); } while (used.has(table) && used.size < 12);
  const prog = G.t / DAY_LEN;
  const t = { id: ++G.seq, dish, table, t0: G.t, patience: (60 + dish.items.length * 7 + dish.sauces.length * 5) * lerp(1, .78, prog) };
  G.tickets.push(t);
  if (!selTicket()) G.sel = t.id;
  sfx.bell();
  renderTickets();
}
function wokStats() {
  let mainN = 0, mainCook = 0, all = 0, burnt = 0, lost = 0, total = 0;
  const coated = new Array(NS).fill(0);
  for (const k of FOOD_KEYS) {
    const f = FOODS[k], d = ING[k];
    for (let i = 0; i < f.n; i++) {
      total++;
      if (f.st[i] !== 0) { lost++; continue; }
      all++;
      if (d.main) { mainN++; mainCook += f.cook[i]; }
      if (f.burn[i] > 0.45) burnt++;
      for (let s = 0; s < NS; s++) coated[s] += f.coat[i * NS + s];
    }
  }
  let cook = mainN ? mainCook / mainN : 0;
  if (!mainN) { let s = 0; for (const k of FOOD_KEYS) { const f = FOODS[k]; for (let i = 0; i < f.n; i++) if (f.st[i] === 0) s += f.cook[i]; } cook = all ? s / all : 0; }
  const poured = Object.keys(W.sauces);
  const mix = poured.length && all ? poured.reduce((a, s) => a + coated[SI[s]] / all, 0) / poured.length : null;
  return { cook, burn: all ? burnt / all : 0, mix, spill: total ? lost / total : 0, count: all };
}
function evaluate(t) {
  const d = t.dish, st = wokStats(), bad = [], good = [];
  let score = 100;
  const oilTot = (W.oils.oil || 0) + (W.oils.sesame || 0);
  if (!oilTot) { score -= 15; bad.push('沒放油，黏鍋了'); }
  else if (d.oil === 'sesame' && !W.oils.sesame) { score -= 10; bad.push('三杯雞要用麻油啦'); }
  else if (d.oil === 'oil' && W.oils.sesame) { score -= 4; bad.push('麻油味好重'); }
  if (oilTot >= 3) { score -= 8; bad.push('好油喔'); }
  for (const k of d.items) if (!W.adds[k]) { score -= 18; bad.push('少了' + ING[k].name); }
  for (const k in W.adds) if (!d.items.includes(k)) { score -= 8; bad.push('怎麼有' + ING[k].name + '？'); }
  for (const s of d.sauces) {
    const c = W.sauces[s] || 0;
    if (!c) { score -= 10; bad.push(SEAS[s].strong ? '味道太淡' : '少了' + SEAS[s].name); }
    else if (c > 1) { score -= (SEAS[s].strong ? 6 : 3) * (c - 1); bad.push(SEAS[s].strong ? '太鹹了' : SEAS[s].name + '放太多'); }
  }
  for (const s in W.sauces) if (!d.sauces.includes(s)) { score -= 6; bad.push('怎麼有' + SEAS[s].name + '的味道？'); }
  if (st.cook < .5) { score -= 30; bad.push('裡面還是生的…'); }
  else if (st.cook < .85) { score -= 12; bad.push('有點不夠熟'); }
  else if (st.cook > 2.2) { score -= 14; bad.push('炒太老了，好柴'); }
  else if (st.cook > 1.6) { score -= 6; bad.push('稍微炒過頭'); }
  if (st.burn > .25) { score -= 25; bad.push('焦掉了啦！'); }
  else if (st.burn > .1) { score -= 10; bad.push('有點焦'); }
  else if (st.burn > .02) { score += 3; good.push('有焦香'); }
  if (st.mix != null && st.mix < .6) { score -= 10; bad.push('調味沒拌勻'); }
  if (st.spill > .25) { score -= 10; bad.push('份量好少'); }
  const wh = Math.min(12, W.wh * 1.5); score += wh;
  if (wh >= 6) good.push('鍋氣十足！');
  if (W.bao) { score += 4; good.push('爆香得好'); }
  score = clamp(Math.round(score), 0, 100);
  const stars = score >= 85 ? 3 : score >= 65 ? 2 : score >= 40 ? 1 : 0;
  const uniq = [...new Set(bad)];
  let words = [];
  if (stars === 3 && !uniq.length) words.push(good[0] || '火候剛好，好吃！');
  else words = uniq.slice(0, 2).concat(stars >= 2 && good.length ? [good[0]] : []).slice(0, 2);
  if (!words.length) words.push(stars >= 2 ? '還不錯吃' : '普普通通');
  return { score, stars, words };
}
function serve() {
  if (!G.running || G.paused) return;
  const t = selTicket();
  if (!t) { pop(G.tickets.length ? '先點一張單' : '還沒有客人點這道', 'bad'); return; }
  if (contentsCount() === 0) { pop('鍋裡還沒有東西', 'bad'); return; }
  const r = evaluate(t);
  const left = clamp(1 - (G.t - t.t0) / t.patience, 0, 1);
  let pay = 0, tip = 0;
  if (r.stars > 0) { pay = t.dish.price; if (r.stars >= 2) tip = Math.round(t.dish.price * .3 * left * (r.stars - 1) / 2 / 5) * 5; }
  G.money += pay + tip; G.served++; G.starSum += r.stars;
  if (r.stars === 0) { G.hearts--; sfx.bad(); } else sfx.cash();
  showResult(t, r, pay, tip);
  G.tickets = G.tickets.filter((x) => x !== t);
  G.sel = G.tickets.length ? G.tickets[0].id : null;
  clearWok();
  renderTickets(); refreshHud();
  if (G.hearts <= 0) endDay(true);
}
function showResult(t, r, pay, tip) {
  document.querySelectorAll('.result').forEach((e) => e.remove());
  const el = document.createElement('div'); el.className = 'result';
  const stars = '★'.repeat(r.stars) + '☆'.repeat(3 - r.stars);
  el.innerHTML = `<h3><span>${t.dish.name}</span><span class="stars">${stars}</span></h3>
    <div class="pay${pay ? '' : ' no'}">${pay ? `+${fmtMoney(pay)}${tip ? `　小費 ${fmtMoney(tip)}` : ''}` : `${t.table} 桌不付錢，口碑 −1`}</div>
    ${r.words.map((w) => `<p>「${w}」</p>`).join('')}`;
  $('#stage').appendChild(el);
  setTimeout(() => el.remove(), 2700);
}
function clearWok() { const T = W.T; resetWok(); W.T = T; }
$('#serve').addEventListener('click', serve);
$('#dump').addEventListener('click', () => {
  if (!G.running || G.paused || contentsCount() === 0) return;
  clearWok(); whoosh(.5, 400, .4); pop('整鍋倒掉了'); refreshNeeds();
});

// ======================= day flow =======================
function startDay() {
  initAudio(); if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume();
  Object.assign(G, { running: true, paused: false, t: 0, money: 0, hearts: 3, served: 0, starSum: 0, missed: 0, tickets: [], nextAt: 1.5, sel: null, ended: false, tossed: false });
  W.T = 25; clearWok();
  $('#hint').hidden = false;
  $('#scr-start').hidden = true; $('#scr-end').hidden = true;
  renderTickets(); refreshHud();
}
function loadBest() { try { return JSON.parse(localStorage.getItem('kuaichao-best') || 'null'); } catch (e) { return null; } }
function saveBest(b) { try { localStorage.setItem('kuaichao-best', JSON.stringify(b)); } catch (e) {} }
function showBest(el) { const b = loadBest(); el.textContent = b ? `最佳紀錄：一晚 ${fmtMoney(b.money)}・出菜 ${b.served} 道` : ''; }
function endDay(broke) {
  G.running = false; G.ended = true;
  const avg = G.served ? G.starSum / G.served : 0;
  $('#end-title').textContent = broke ? '口碑掉光，今天先收攤了…' : '22:00 打烊，今天辛苦了！';
  $('#e-money').textContent = fmtMoney(G.money);
  $('#e-served').textContent = G.served + ' 道';
  $('#e-avg').textContent = G.served ? '★'.repeat(Math.round(avg)) + '☆'.repeat(3 - Math.round(avg)) + ' ' + avg.toFixed(1) : '—';
  $('#e-missed').textContent = G.missed + ' 桌';
  $('#end-note').textContent = G.served === 0 ? '下次先選單、下油，再照單下料。'
    : avg >= 2.5 ? '整條街都聞到你的鍋氣了。' : avg >= 1.5 ? '客人吃得滿意，明天再快一點。' : '多甩幾下鍋，熟了再出菜。';
  const b = loadBest();
  if (!b || G.money > b.money) saveBest({ money: G.money, served: G.served });
  showBest($('#best-end'));
  $('#scr-end').hidden = false;
  G.tickets = []; renderTickets();
}
function setPaused(p) {
  if (!G.running) return;
  G.paused = p; $('#scr-pause').hidden = !p;
  if (AU.ctx) { if (p) AU.ctx.suspend(); else AU.ctx.resume(); }
}
$('#btn-start').addEventListener('click', startDay);
$('#btn-again').addEventListener('click', startDay);
$('#btn-resume').addEventListener('click', () => setPaused(false));
$('#pause').addEventListener('click', () => setPaused(!G.paused));
document.addEventListener('visibilitychange', () => { if (document.hidden && G.running) setPaused(true); });
$('#mute').addEventListener('click', () => {
  AU.muted = !AU.muted; $('#mute').textContent = AU.muted ? '✕' : '♪';
  $('#mute').setAttribute('aria-label', AU.muted ? '打開聲音' : '關閉聲音');
  if (AU.master) AU.master.gain.value = AU.muted ? 0 : 0.7;
});
showBest($('#best-start'));

// ======================= input: swipe up on the wok to toss =======================
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { y: e.clientY, t: performance.now() }; canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const dy = drag.y - e.clientY, dt = Math.max(60, performance.now() - drag.t);
  drag = null;
  if (dy > 25) toss(clamp(0.6 + dy / 220 + 120 / dt * 0.25, 0.6, 1.7));
  else toss(1.0);
});
canvas.addEventListener('pointercancel', () => { drag = null; });
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); toss(e.shiftKey ? 1.5 : 1.0); }
  else if (e.code === 'Enter') serve();
});

// ======================= main loop =======================
function resize() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const dist = Math.max(6.5, 2.75 / (Math.tan(camera.fov / 2 * PI / 180) * camera.aspect));
  camera.position.copy(CAM_DIR).multiplyScalar(dist).add(LOOK);
  camera.lookAt(LOOK);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stageEl);
resize();

let last = performance.now(), frame = 0, uiT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (G.paused) { renderer.render(scene, camera); return; }
  frame++;
  const live = G.running;
  if (live) {
    G.t += dt;
    // orders
    if (G.t >= G.nextAt && G.t < DAY_LEN - 12) {
      if (G.tickets.length < 5) spawnOrder();
      G.nextAt = G.t + lerp(17, 9, G.t / DAY_LEN) * rand(.8, 1.2);
    }
    for (const t of [...G.tickets]) {
      if (G.t - t.t0 > t.patience) {
        G.tickets = G.tickets.filter((x) => x !== t); G.missed++; G.hearts--;
        if (G.sel === t.id) G.sel = G.tickets.length ? G.tickets[0].id : null;
        pop(`${t.table} 桌等太久，走掉了`, 'bad'); sfx.bad(); renderTickets(); refreshHud();
      }
    }
    if (G.hearts <= 0) endDay(true);
    else if (G.t >= DAY_LEN) endDay(false);
  }
  // wok temperature
  const target = FIRE_T[fire];
  W.T += (target - W.T) * dt * (target > W.T ? 0.5 : 0.12);
  const food = contentsCount();
  if (food) W.oil = Math.max(0, W.oil - dt * 0.012);
  const dry = food > 0 && W.oil < 0.25;
  if (dry && W.T > 200 && live && !W.dryWarned) { W.dryWarned = true; pop('沒油了，會黏鍋', 'bad'); }
  // toss animation: lift, tilt, flick
  if (W.tossAnim >= 0) {
    W.tossAnim += dt;
    const u = W.tossAnim / 0.34, s = Math.sin(PI * clamp(u, 0, 1)) * Math.min(1.3, W.tossPow);
    wok.position.y = s * 0.22; wok.position.z = -s * 0.16; wok.rotation.x = -s * 0.2;
    if (!W.impulse && u > 0.22) { W.impulse = true; applyToss(W.tossPow); }
    if (u >= 1) { W.tossAnim = -1; wok.position.set(0, 0, 0); wok.rotation.set(0, 0, 0); }
  }
  // food physics
  const heat = Math.max(0, W.T - 100) / 120;
  for (const k of FOOD_KEYS) if (FOODS[k].n) FOODS[k].step(dt, heat, dry ? 2.5 : 1);
  for (let j = 1; j < GN - 1; j++) for (let i = 1; i < GN - 1; i++) {   // blur the pile so it reads as one heap
    const c = j * GN + i;
    hgt[c] = hacc[c] * .5 + (hacc[c - 1] + hacc[c + 1] + hacc[c - GN] + hacc[c + GN]) * .125;
  }
  hacc.fill(0);
  const paint = frame % 2 === 0;
  for (const k of FOOD_KEYS) if (FOODS[k].n || FOODS[k].mesh.count) FOODS[k].draw(paint);
  // burn warning
  if (live && food && frame % 30 === 0) {
    const st = wokStats();
    if (st.burn > .08 && !W.burnWarned) { W.burnWarned = true; pop('焦味飄出來了…', 'bad'); }
  }
  // fire, steam, light
  const fl = [0, 3, 6, 11][fire] * dt * 60;
  for (let i = 0; i < fl; i++) {
    const a = Math.random() * PI * 2, rr = rand(.45, .85), sp = rand(.4, 1.2) * fire;
    flames.emit(Math.cos(a) * rr, STOVE_Y + .15, Math.sin(a) * rr, Math.cos(a) * sp, rand(1.8, 3) + fire * .5, Math.sin(a) * sp, rand(.45, .7) + fire * .08, C_FIRE);
  }
  fireLight.intensity = lerp(fireLight.intensity, [0, .8, 1.6, 2.8][fire] * rand(.85, 1.15), .3);
  flareLight.intensity *= Math.pow(0.02, dt);
  if (food && W.T > 140 && Math.random() < dt * (3 + sizzleBoost * 30)) {
    steam.emit(rand(-.9, .9), .5, rand(-.9, .9), rand(-.2, .2), rand(.6, 1.2), rand(-.2, .2), rand(1.5, 2.6), new THREE.Color(1, .96, .9));
  }
  flames.update(dt); flare.update(dt); steam.update(dt); pourFx.update(dt); specks.update(dt);
  oilMat.opacity = lerp(oilMat.opacity, Math.min(.6, W.oil * .35), .1);
  const glow = clamp((W.T - 250) / 60, 0, 1) * (food ? .25 : 1);
  wokMat.emissive.setRGB(glow * .35, glow * .06, 0);
  // sizzle sound
  sizzleBoost = Math.max(0, sizzleBoost - dt * .8);
  if (AU.sizzle && !AU.muted) {
    const lvl = (food || W.oil > .1) ? clamp((W.T - 110) / 170, 0, 1) * (.35 + .65 * Math.min(1, food / 500)) + sizzleBoost * .5 : 0;
    AU.sizzle.gain.setTargetAtTime(lvl * .22, AU.ctx.currentTime, .08);
  }
  // HUD
  uiT += dt;
  if (uiT > .2) {
    uiT = 0;
    updateTicketBars(); refreshHud();
    const T = Math.round(W.T);
    $('#c-temp').textContent = T + '°C';
    $('#m-temp').style.width = clamp((W.T - 25) / 290 * 100, 0, 100) + '%';
    $('#m-temp').style.background = W.T > 270 ? 'var(--bad)' : W.T > 200 ? 'var(--lamp)' : 'var(--muted)';
    const st = food ? wokStats() : null;
    if (st && st.count) {
      const c = st.cook, label = c < .5 ? '生' : c < .85 ? '半生' : c < 1.6 ? '剛好' : c < 2.2 ? '有點老' : '過老';
      $('#c-cook').textContent = label + (st.burn > .1 ? '・焦' : '');
      $('#m-cook').style.width = clamp(c / 2.2 * 100, 0, 100) + '%';
      $('#m-cook').style.background = c < .85 ? 'var(--warn)' : c < 1.6 ? 'var(--good)' : 'var(--bad)';
      $('#c-mix').textContent = st.mix == null ? '—' : Math.round(st.mix * 100) + '%';
      $('#m-mix').style.width = (st.mix == null ? 0 : st.mix * 100) + '%';
      $('#m-mix').style.background = st.mix != null && st.mix >= .6 ? 'var(--good)' : 'var(--warn)';
    } else {
      $('#c-cook').textContent = '—'; $('#m-cook').style.width = '0'; $('#c-mix').textContent = '—'; $('#m-mix').style.width = '0';
    }
    $('#c-wh').textContent = W.wh.toFixed(1);
    $('#m-wh').style.width = clamp(W.wh / 8 * 100, 0, 100) + '%';
  }
  renderer.render(scene, camera);
}

// fonts first, so the bottle labels draw with the right face
const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(() => { buildRack(); refreshNeeds(); });
refreshHud();
requestAnimationFrame(loop);
})();
</script>
